name: Twitch live alerts

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidtide-offline-twitch
  cancel-in-progress: false

jobs:
  notify:
    # Disabled by default. Public repositories use standard free hosted runners.
    # Skip private repositories to avoid automatically consuming billed minutes.
    if: vars.VOIDTIDE_OFFLINE_TWITCH_ENABLED == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Twitch and deliver a deduplicated opt-in alert
        run: npm run notify:twitch
        env:
          VOIDTIDE_OFFLINE_TWITCH_ENABLED: ${{ vars.VOIDTIDE_OFFLINE_TWITCH_ENABLED }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_LIVE_CHANNEL_ID: ${{ vars.TWITCH_LIVE_CHANNEL_ID }}
          TWITCH_NOTIFICATION_ROLE_ID: ${{ vars.TWITCH_NOTIFICATION_ROLE_ID }}
          TWITCH_LOGIN: ${{ vars.TWITCH_LOGIN || 'voidtideus' }}
          TWITCH_ALERT_COOLDOWN_MINUTES: ${{ vars.TWITCH_ALERT_COOLDOWN_MINUTES || '5' }}
